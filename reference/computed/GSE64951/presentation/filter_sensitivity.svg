<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" role="img" aria-labelledby="title description"><title id="title">Filtering sensitivity from the completed raw saliva analysis</title><desc id="description">Three declared rules retained 20,527, 11,171 and 10,014 genes. The paper reported 20,407. All bars start at zero.</desc><style>:root{--cp-bg:#f7f4ef;--cp-text:#242424;--cp-text-muted:#5c5c5c;--cp-accent:#b11f4b;--cp-border:#dedede;--cp-border-strong:#919191}</style><g font-family="Segoe UI, Aptos, Calibri, sans-serif"><text x="0" y="30" font-size="29" text-anchor="start" fill="var(--cp-text)">Saliva low-expression filtering: declared sensitivity analysis</text><text x="0" y="66" font-size="22" text-anchor="start" fill="var(--cp-text)">Input: 20,953 mapped genes; reference: 20,407 retained</text><line x1="1075.83" x2="1075.83" y1="86" y2="298" stroke="var(--cp-text)" stroke-width="2" stroke-dasharray="6 5"/><text x="0" y="133" font-size="24" text-anchor="start" fill="var(--cp-accent)">Any sample above median (default)</text><rect data-rule="any_above_median" data-count="20527" x="510" y="106" width="569.157727" height="34" rx="4" fill="var(--cp-accent)"/><text x="1140" y="133" font-size="26" text-anchor="start" fill="var(--cp-accent)">20,527</text><text x="0" y="205" font-size="24" text-anchor="start" fill="var(--cp-text)">Gene mean above median</text><rect data-rule="mean_above_median" data-count="11171" x="510" y="178" width="309.741364" height="34" rx="4" fill="var(--cp-border-strong)"/><text x="1140" y="205" font-size="26" text-anchor="start" fill="var(--cp-text)">11,171</text><text x="0" y="277" font-size="24" text-anchor="start" fill="var(--cp-text)">At least half the samples above median</text><rect data-rule="half_above_median" data-count="10014" x="510" y="250" width="277.660909" height="34" rx="4" fill="var(--cp-border-strong)"/><text x="1140" y="277" font-size="26" text-anchor="start" fill="var(--cp-text)">10,014</text><line x1="510" x2="1120" y1="309" y2="309" stroke="var(--cp-border-strong)" stroke-width="2"/><text x="510" y="339" font-size="20" text-anchor="middle" fill="var(--cp-text)">0</text><text x="787.273" y="339" font-size="20" text-anchor="middle" fill="var(--cp-text)">10,000</text><text x="1120" y="339" font-size="20" text-anchor="middle" fill="var(--cp-text)">22,000</text><text x="0" y="390" font-size="22" text-anchor="start" fill="var(--cp-text)">Dashed line: published retained count. Alternatives were not selected to force agreement.</text><text x="0" y="425" font-size="19" text-anchor="start" fill="var(--cp-text)">Derived from saved filter_sensitivity.csv; this is not a new DE or model run.</text></g></svg>
