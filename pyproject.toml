[project]
name = "gastric-repro"
version = "0.1.0"
description = "Auditable Python reproduction of Lopes et al. gastric cancer transcriptomics"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gseapy==1.3.2",
    "imbalanced-learn==0.14.2",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "xgboost==3.4.1",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project.scripts]
gastric-repro = "gastric_repro.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]
